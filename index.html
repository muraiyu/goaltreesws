<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="目標から逆算する、勉強のタスク管理アプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="目標ツリー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>目標ツリー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app — scrolling page body above a fixed 5-tab bar; content column up to 1100px, roadmap uses full width */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece7; --line:#d5ddd6;
  --ink:#17241f; --ink2:#4d5d55; --ink3:#7d8b84;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --warn:#b4533c; --warn-soft:#f6e3dd;
  --task:#5b6fd6; --asg:#b98500; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --shadow:0 1px 2px rgba(23,36,31,.06),0 4px 14px rgba(23,36,31,.06);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --sunk:#222c27; --line:#2f3b35;
  --ink:#e9efeb; --ink2:#b3c0b9; --ink3:#83928a;
  --accent:#6fbf95; --accent-ink:#0d1a13; --accent-soft:#24392e;
  --warn:#e8876f; --warn-soft:#3a2420;
  --task:#7a88f2; --asg:#c99a2e; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --sunk:#222c27; --line:#2f3b35;
  --ink:#e9efeb; --ink2:#b3c0b9; --ink3:#83928a;
  --accent:#6fbf95; --accent-ink:#0d1a13; --accent-soft:#24392e;
  --warn:#e8876f; --warn-soft:#3a2420;
  --task:#7a88f2; --asg:#c99a2e; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
header.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
header.top .sub{color:var(--ink3);font-size:13px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.card h2 .count{color:var(--ink3);font-weight:500;font-size:13px}
.card h2 .grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.empty{color:var(--ink3);font-size:13px;padding:6px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.tog::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid currentColor;margin-right:6px;vertical-align:-1px}
.btn.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.hidden-note{font-size:12px;color:var(--ink3)}
.link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:700;padding:2px 4px}
/* task rows */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink3);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .chk svg{opacity:1}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:0;text-align:left;padding:0}
.task .t{font-weight:500;overflow-wrap:anywhere}
.task.done .t{color:var(--ink3);text-decoration:line-through}
.task .meta{font-size:12px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap}
.task .meta .late{color:var(--warn);font-weight:700}
.task .min{flex:none;font-size:13px;color:var(--ink2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px}
.day-h{font-size:12px;font-weight:700;color:var(--ink2);margin-top:8px;display:flex;justify-content:space-between}
.day-h:first-child{margin-top:0}
/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wk .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk .barbox{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wk .bar{width:min(28px,70%);border-radius:4px 4px 0 0;background:var(--accent-soft);position:relative;min-height:2px;display:flex;flex-direction:column-reverse}
.wk .bar i{display:block;background:var(--accent);border-radius:0}
.wk .bar i:last-child{border-radius:4px 4px 0 0}
.wk .lbl{font-size:11px;color:var(--ink3)}
.wk .lbl.today{color:var(--ink);font-weight:700}
.wk .v{font-size:10.5px;color:var(--ink2);text-align:center;line-height:1.25}
.stat{display:flex;gap:20px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat .k{font-size:12px;color:var(--ink3)}
.stat .n{font-size:24px;font-weight:500}
.stat .n small{font-size:13px;color:var(--ink3);margin-left:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* roadmap */
.subj-row{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.subj-row>*{flex:none}
.subj-row .hint{font-size:12px;color:var(--ink3)}
.chip{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-style:solid}
.rm-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:calc(100vh - 250px);min-height:260px;overscroll-behavior-x:contain}
.rm{--labw:158px;position:relative}
@media (min-width:640px){.rm{--labw:220px}}
.rm-head,.rm-row{display:flex;height:44px}
.rm-head{height:46px;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.rm-row{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.rm-row.root{border-top:1px solid var(--line)}
.rm-lab{position:sticky;left:0;z-index:3;flex:none;width:var(--labw);background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px 0 8px;min-width:0}
.rm-head .rm-lab{z-index:5;font-size:12px;color:var(--ink3);padding-left:12px}
.rm-lab .ind{flex:none}
.rm-lab .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;border:0;background:transparent;padding:0;text-align:left}
.rm-row.root .rm-lab .t{font-weight:900}
.rm-lab.done .t{text-decoration:line-through;color:var(--ink3)}
.rm-lab .tw{width:22px;height:22px;border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--ink3);flex:none}
.rm-lab .tw svg{width:14px;height:14px;transition:transform .15s}
.rm-lab .tw.open svg{transform:rotate(90deg)}
.mchk{width:20px;height:20px;border-radius:6px;border:2px solid var(--task);background:transparent;display:grid;place-items:center;padding:0;flex:none;margin:0 1px;color:var(--surface)}
.mchk svg{width:12px;height:12px;opacity:0}
.mchk.on{background:var(--task)}
.mchk.on svg{opacity:1}
.rm-track,.rm-scale{position:relative;flex:none}
.rm-body{position:relative}
.rm-grid{position:absolute;top:0;bottom:0;left:var(--labw);pointer-events:none}
.rm-grid i{position:absolute;top:0;bottom:0}
.rm-grid .mline{width:1px;background:var(--line)}
.rm-grid .wkend{background:color-mix(in srgb,var(--line) 35%,transparent)}
.rm-grid .offr{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 16%,transparent) 0 5px,transparent 5px 11px)}
.rm-grid .today{width:2px;background:var(--ink);opacity:.75}
.rm-scale .mon{position:absolute;top:4px;font-size:12px;font-weight:700;white-space:nowrap;padding-left:5px}
.rm-scale .day{position:absolute;bottom:4px;font-size:10.5px;color:var(--ink3);font-family:var(--f-num);transform:translateX(-50%)}
.rm-scale .tdy{position:absolute;bottom:3px;z-index:1;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 4px;transform:translateX(-50%);white-space:nowrap}
.rm-scale .offl{position:absolute;top:4px;font-size:10.5px;color:var(--warn);white-space:nowrap}
.rm-line{position:absolute;top:20px;height:4px;border-radius:2px;background:var(--line)}
.rm-line>i{position:absolute;left:0;top:-1px;height:6px;background:var(--ink3);border-radius:3px}
.rm-dia{position:absolute;top:15px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);border:2px solid var(--ink);background:var(--surface);padding:0;border-radius:2px;z-index:1}
.rm-dia.goal{background:var(--ink)}
.rm-dia.tk{border-color:var(--task)}
.rm-dia.tk.done{background:var(--task)}
.rm-dia.shared{width:9px;height:9px;top:17px;border-width:1.5px;pointer-events:none}
.rm-tag{position:absolute;top:12px;font-size:11.5px;color:var(--ink3);white-space:nowrap;pointer-events:none;font-family:var(--f-num)}
.rm-legend i{display:inline-block}
.lg-dia{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--ink);border-radius:1px}
.lg-dia.goal{background:var(--ink)}.lg-dia.tk{border-color:var(--task);background:var(--task)}
.lg-today{width:2px;height:12px;background:var(--ink)}
.lg-off{width:16px;height:10px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 35%,transparent) 0 3px,transparent 3px 6px)}
.rm-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.rm-legend span{display:inline-flex;align-items:center;gap:5px}
/* blocks */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--accent);font-weight:700}
.crumbs .sep{color:var(--ink3)}
.crumbs .cur{font-weight:700;padding:2px 4px}
/* スマホ(〜520px)は3列。それより広い画面は幅に合わせて列を増やす(1つ170px前後) */
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:520px){.blocks{grid-template-columns:repeat(3,minmax(0,1fr))}}
.blk{aspect-ratio:1/1;max-width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;overflow:hidden;min-width:0}
.blk:hover{box-shadow:var(--shadow)}
.blk::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.blk .bt{font-weight:700;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;margin-top:4px;padding-right:34px}
.blk .bm{font-size:11px;color:var(--ink3);margin-top:auto;display:flex;flex-direction:column;gap:1px}
.blk .pg{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.blk .pg i{display:block;height:100%;background:var(--c)}
.blk .pct{position:absolute;right:10px;top:12px;font-size:12px;color:var(--ink2)}
.blk.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink3);font-weight:700}
.blk.add::before{display:none}
.blk.add b{font-size:32px;font-weight:400;line-height:1}
/* 枠の中のブロック:少し小さく */
.blocks.in{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.blocks.in .blk{padding:10px;border-radius:12px}
.blocks.in .blk .bt{font-size:14px}
.blk .bm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){
  .blocks{gap:8px}
  .blk{padding:8px;gap:4px;border-radius:12px}
  .blk::before{height:4px}
  .blk .bt{font-size:12.5px;padding-right:28px;-webkit-line-clamp:3}
  .blk .pct{top:9px;right:7px;font-size:10.5px}
  .blk .bm{font-size:10px}
  .blk .bm span+span{display:none}
  .blk .pg{height:4px}
  .blk.add{font-size:11px;text-align:center}
  .blk.add b{font-size:24px}
  .blocks.in{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .blocks.in .blk{padding:7px;border-radius:10px}
  .blocks.in .blk .bt{font-size:12px}
  .blocks.in .blk .pct{top:8px;right:6px;font-size:10px}
}
.ginfo{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.ginfo b{color:var(--ink);font-weight:500}
/* calendar */
.cal-m{display:flex;flex-direction:column;gap:6px}
.cal-m h3{margin:6px 0 0;font-size:16px;font-weight:900;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.cal-dow{font-size:11px;text-align:center;color:var(--ink3);padding:2px 0}
.cal-d{min-height:68px;border:0;background:transparent;border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cal-d:hover{background:var(--sunk)}
.cal-d .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:13px}
.cal-d.today .n{border:2px solid var(--warn);font-weight:700;color:var(--warn)}
.cal-d.sun .n{color:var(--warn)} .cal-d.sat .n{color:var(--s1)}
.cal-d.today.sun .n,.cal-d.today.sat .n{color:var(--warn)}
.cal-d .ev{width:100%;font-size:10px;line-height:1.3;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ink);text-align:left}
.cal-d .more{font-size:10px;color:var(--ink3)}
.cal-d.blank{visibility:hidden}
#calMore{height:40px}
/* materials */
.mat{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mat:first-child{border-top:0}
.mat .info{flex:1;min-width:160px;display:flex;flex-direction:column}
.mat .info b{font-weight:700}
.mat .info small{color:var(--ink3);font-size:12px}
.reps{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.reps i{width:10px;height:10px;border-radius:3px;background:var(--sunk)}
.reps i.on{background:var(--accent)}
.mat .cnt{font-size:22px;min-width:3ch;text-align:right}
/* assignments */
.asg{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.asg:first-child{border-top:0}
.due{flex:none;min-width:60px;text-align:center;border-radius:10px;padding:6px 4px;background:var(--accent-soft);color:var(--ink);font-family:var(--f-num);font-weight:500;font-size:13px;line-height:1.25}
.due small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--ink2)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.soon small{color:var(--warn)}
.due.fin{background:var(--sunk);color:var(--ink3)}
.asg .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:left}
.asg .info b{overflow-wrap:anywhere;font-weight:700}
.asg.done .info b{text-decoration:line-through;color:var(--ink3)}
.asg .info small{color:var(--ink3);font-size:12px}
.apg{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.apg i{display:block;height:100%;background:var(--asg)}
.asg .chk{border-color:var(--asg)}
.asg.done .chk{background:var(--asg);border-color:var(--asg)}
.rm-bar{position:absolute;top:15px;height:14px;border-radius:4px;overflow:hidden;border:0;padding:0;background:color-mix(in srgb,var(--asg) 25%,var(--surface))}
.rm-bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--asg)}
.rm-bar.done{opacity:.5}
.rm-row.grp{height:34px;border-top:1px solid var(--line)}
.rm-row.grp .rm-lab{background:var(--bg)}
.rm-row.grp .t{color:var(--ink3);font-weight:700}
.mchk.asgc{border-color:var(--asg)}.mchk.asgc.on{background:var(--asg)}
.lg-bar{width:16px;height:8px;border-radius:3px;background:var(--asg)}
/* activity log */

<script>
(() => {
"use strict";
/* ---------- アプリ情報 ---------- */
// ストアに公開したら、ここにIDを入れるとレビューのボタンがそのページへ飛ぶ
const APP = {
  name: "目標ツリー", subtitle: "目標から逆算する、勉強のタスク管理", version: "1.0.0", updated: "2026-10-31",
  author: "Sprout Works Studio", feedbackMail: "sproutworksstudio@gmail.com",
  appStoreId: "",      // App Store のアプリID(数字。例 "1234567890")
  playPackage: "",     // Google Play のパッケージ名(例 "com.example.goaltree2")
};
const REVIEW = {
  ios: APP.appStoreId ? `https://apps.apple.com/app/id${APP.appStoreId}?action=write-review` : "",
  android: APP.playPackage ? `https://play.google.com/store/apps/details?id=${encodeURIComponent(APP.playPackage)}&showAllReviews=true` : "",
};
const platform = () => { const u = navigator.userAgent; return /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "ios" : /Android/.test(u) ? "android" : "pc"; };
// レビューは今は App Store だけ(Google Play はまだ出さない)
function reviewButtons() {
  return REVIEW.ios ? `<a class="btn pri" href="${REVIEW.ios}" target="_blank" rel="noopener" data-act="reviewGo">App Storeでレビューする</a>` : `<button class="btn pri" data-act="reviewNA" data-v="App Store">App Storeでレビューする</button>`;
}

/* ---------- 日付ユーティリティ ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日(${DOW[d.getDay()]})`; };
const today = () => ymd(new Date());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h}時間${m}分` : `${h}時間`) : `${m}分`; };
const hrs = min => (Math.round(min / 6) / 10).toFixed(1);
// 大きな数字の表示用:「7時間20分」の数字だけを大きく
const hmBig = min => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}<small>時間</small>${m ? `${m}<small>分</small>` : ""}` : `${m}<small>分</small>`; };
// 見込み時間の入力欄:「時間」と「分」の2つ
const durFields = (name, min, label, opts = {}) => { const v = Math.abs(Math.round(min || 0)); return `<div class="f"><span>${label}</span><div class="dur">${opts.sign ? `<select name="${name}S" id="${name}S" aria-label="足す・引く"><option value="1">足す</option><option value="-1">引く</option></select>` : ""}<input type="number" name="${name}H" id="${name}H" min="0" max="9999" step="1" inputmode="numeric" value="${Math.floor(v / 60)}" aria-label="${label}(時間)"><span>時間</span><input type="number" name="${name}M" id="${name}M" min="0" max="59" step="1" inputmode="numeric" value="${v % 60}" aria-label="${label}(分)"><span>分</span></div></div>`; };
const durRead = (fd, name) => Math.max(0, (+fd.get(name + "H") || 0) * 60 + (+fd.get(name + "M") || 0)) * (fd.has(name + "S") ? +fd.get(name + "S") || 1 : 1);
const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"];
const col = i => `var(${COLORS[(i ?? 0) % COLORS.length]})`;

/* ---------- サンプルデータ ---------- */
function sample() {
  const t = today(), D = n => addDays(t, n);
  const goals = [
    { id: "g1", pid: null, title: "後期期末試験", start: D(-7), end: D(24), hours: 40, progress: 20, color: 0, note: "履修中の全科目で単位を取る・GPA 3.0以上" },
    { id: "g2", pid: "g1", title: "マクロ経済学", start: D(-7), end: D(20), hours: 15, progress: 30, color: 0, note: "" },
    { id: "g3", pid: "g2", title: "講義スライドの復習", start: D(-3), end: D(14), hours: 8, progress: 40, color: 0, note: "第7回〜第12回" },
    { id: "g4", pid: "g1", title: "統計学", start: D(-5), end: D(22), hours: 12, progress: 10, color: 0, note: "" },
    { id: "g5", pid: "g1", title: "ドイツ語Ⅱ", start: D(0), end: D(23), hours: 6, progress: 0, color: 0, note: "" },
    { id: "g6", pid: null, title: "TOEIC 730点", start: D(0), end: D(200), hours: 60, progress: 5, color: 2, note: "就活までに" },
    { id: "g7", pid: null, title: "日商簿記2級", start: D(-30), end: D(220), hours: 90, progress: 8, color: 1, note: "6月の試験で合格" },
  ];
  const tasks = [
    { id: "t1", gid: "g2", title: "過去問 2025年度 期末", date: D(0), min: 60, done: false },
    { id: "t2", gid: "g4", title: "演習問題 第6回(t検定)", date: D(0), min: 45, done: false },
    { id: "t3", gid: "g6", title: "TOEIC単語 50語", date: D(0), min: 20, done: true, doneOn: D(0) },
    { id: "t4", gid: "g3", title: "第7回 まとめノート", date: D(-1), min: 40, done: false },
    { id: "t5", gid: "g4", title: "小テストの解き直し", date: D(-2), min: 30, done: false },
    { id: "t6", gid: "g3", title: "第8回 まとめノート", date: D(1), min: 50, done: false },
    { id: "t7", gid: "g5", title: "動詞の現在完了 練習問題", date: D(1), min: 30, done: false },
    { id: "t8", gid: "g4", title: "回帰分析 復習", date: D(2), min: 40, done: false },
    { id: "t9", gid: "g6", title: "公式問題集 Part 5・6", date: D(3), min: 60, done: false },
    { id: "t10", gid: "g2", title: "過去問 2024年度 期末", date: D(4), min: 60, done: false },
    { id: "t11", gid: "g5", title: "単語テストの範囲を覚える", date: D(5), min: 25, done: false },
    { id: "t12", gid: "g3", title: "第9回 まとめノート", date: D(6), min: 50, done: false },
    { id: "t13", gid: "g1", title: "シラバスで試験範囲と評価方法を確認", date: D(-6), min: 15, done: true, doneOn: D(-6) },
  ];
  const mats = [
    { id: "m1", gid: "g6", title: "TOEIC単語帳 1〜300", min: 20, target: 10, reps: [D(-9), D(-7), D(-5), D(-3), D(-1)] },
    { id: "m2", gid: "g3", title: "講義スライド 第7回の演習", min: 30, target: 3, reps: [D(-4)] },
    { id: "m3", gid: "g7", title: "簿記2級 仕訳カード", min: 15, target: 5, reps: [] },
  ];
  // 記録:過去1年分のサンプル学習時間(分)
  const rec = {};
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 1; i <= 380; i++) {
    const d = parse(D(-i)), dow = d.getDay();
    if (rnd() < 0.18) continue;
    let m = 30 + rnd() * 70 + (dow === 0 || dow === 6 ? 40 : 0);
    if (i < 30) m += 25;
    rec[D(-i)] = Math.round(m / 5) * 5;
  }
  rec[D(0)] = 20;
  const asgs = [
    { id: "a1", gid: "g4", title: "統計学 課題レポート(回帰分析)", start: D(-2), due: D(1), min: 60, progress: 30, done: false, memo: "", days: [D(0)] },
    { id: "a2", gid: null, title: "ゼミ発表のレジュメ", start: D(-3), due: D(5), min: 300, progress: 40, done: false, memo: "先行研究を3本まとめる", days: [D(-1), D(0), D(2), D(4)] },
    { id: "a3", gid: "g5", title: "ドイツ語 作文(自己紹介)", start: D(2), due: D(9), min: 90, progress: 0, done: false, memo: "" },
  ];
  const log = [
    { id: "l1", date: D(0), kind: "task", ref: "t3", title: "TOEIC単語 50語", est: 20, min: 20, n: 1 },
    { id: "l2", date: D(-1), kind: "mat", ref: "m1", title: "TOEIC単語帳 1〜300", est: 20, min: 25, n: 1 },
  ];
  rec[D(-1)] = Math.max(rec[D(-1)] || 0, 25);
  return { v: 1, goals, tasks, mats, asgs, log, rec, sample: true, weekStart: 0, upd: 0 };
}

/* ---------- 保存 ---------- */
const LS = "goaltree2.state";
let S;
try { S = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { S = null; }
if (!S || S.v !== 1) S = sample();
let ui = { tab: "todo", rmView: "road", span: "3m", node: null, recUnit: "day", calMonths: 6, subj: "", open: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS + ".ui") || "{}")); } catch (e) {}
const tabs = ["todo", "road", "work", "rec", "set"];
if (!tabs.includes(ui.tab)) ui.tab = "todo";
if (!Array.isArray(ui.open)) ui.open = null;
ui.logDate = null;
if (tabs.includes(location.hash.slice(1))) ui.tab = location.hash.slice(1);

let sync = { mode: "local", ref: null, writing: false, again: false, timer: 0 };
function save() {
  S.upd = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (sync.ref) { clearTimeout(sync.timer); sync.timer = setTimeout(push, 700); }
}
async function push() {
  if (sync.writing) { sync.again = true; return; }
  sync.writing = true;
  try { await sync.ref.set({ s: JSON.parse(JSON.stringify(S)), upd: S.upd }); sync.err = null; }
  catch (e) { sync.err = e && e.code; if (ui.tab === "set") render(); }
  sync.writing = false;
  if (sync.again) { sync.again = false; push(); }
}
function saveUI() { try { localStorage.setItem(LS + ".ui", JSON.stringify(ui)); } catch (e) {} }

async function connect() {
  const c = window.claude;
  if (!c || !c.use) return;
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);

function recSeries() {
  const t = today(), out = [];
  if (ui.recUnit === "day") {
    for (let i = 6; i >= 0; i--) { const d = addDays(t, -i); out.push({ d, k: i === 0 ? "今日" : `${md(d)}`, sub: DOW[parse(d).getDay()], full: mdw(d), v: S.rec[d] || 0 }); }
  } else if (ui.recUnit === "week") {
    const td = parse(t), off = (td.getDay() - (S.weekStart || 0) + 7) % 7, ws0 = addDays(t, -off);
    for (let i = 6; i >= 0; i--) {
      const s = addDays(ws0, -7 * i); let v = 0;
      for (let j = 0; j < 7; j++) v += S.rec[addDays(s, j)] || 0;
      out.push({ k: md(s), sub: i === 0 ? "今週" : "〜", full: `${md(s)}〜${md(addDays(s, 6))}の週`, v });
    }
  } else {
    const td = parse(t);
    for (let i = 11; i >= 0; i--) {
      const f = new Date(td.getFullYear(), td.getMonth() - i, 1), pre = `${f.getFullYear()}-${pad(f.getMonth() + 1)}-`;
      let v = 0; for (const k in S.rec) if (k.startsWith(pre)) v += S.rec[k];
      out.push({ k: `${f.getMonth() + 1}月`, sub: f.getMonth() === 0 || i === 11 ? `${f.getFullYear()}` : "", full: `${f.getFullYear()}年${f.getMonth() + 1}月`, v });
    }
  }
  return out;
}

function drawChart() {

  a = a || { title: "", gid: preset.gid || "", start: today(), due: preset.due || addDays(today(), 7), min: 60, progress: 0, memo: "" };
  openSheet(`<form><h2>${isNew ? "課題を追加" : "課題を編集"}</h2>
    <label class="f">課題名<input name="title" id="aTitle" required maxlength="60" value="${esc(a.title)}" placeholder="例:統計学レポート"></label>
    <label class="f">目標(科目)<select name="gid" id="aGid">${goalOptions(a.gid)}</select></label>
    <div class="frow"><label class="f">開始日<input type="date" name="start" id="aStart" value="${a.start || ""}"></label><label class="f">提出期限<input type="date" name="due" id="aDue" required value="${a.due}"></label></div>
    <div class="f"><span>作業する日(タップで選ぶ・いくつでも)</span>
      <div class="pick" id="aPick"></div>
      <div class="pick-sum" id="aPickSum"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn sm" data-pk="week">期間中の平日</button><button type="button" class="btn sm" data-pk="all">期間中すべて</button><button type="button" class="btn sm" data-pk="clear">選択を消す</button></div></div>
    ${durFields("am", a.min, "見込み時間")}
    <label class="f">達成度(%)<input type="number" name="progress" id="aProg" min="0" max="100" step="5" value="${a.done ? 100 : a.progress || 0}"></label>
    <label class="f">メモ<textarea name="memo" id="aMemo" rows="2" maxlength="300">${esc(a.memo)}</textarea></label>
    <div class="acts">${isNew ? "" : delBlock("削除")}<button type="button" class="btn" data-close>キャンセル</button><button class="btn pri">${isNew ? "追加" : "保存"}</button></div></form>`,
  fd => {
    const st = fd.get("start") || null, due = fd.get("due");
    if (st && due < st) { toast("提出期限は開始日より後にしてください"); return false; }
    const v = { title: fd.get("title").trim(), gid: fd.get("gid") || null, start: st, due, min: durRead(fd, "am"), memo: fd.get("memo").trim(), days: [...sel].filter(d => d >= (st || "") && d <= due).sort() };
    const p = +fd.get("progress") || 0;
    if (isNew) { const na = { id: uid(), progress: 0, done: false, ...v }; A().push(na); setAsgProgress(na, p); }
    else { Object.assign(a, v); setAsgProgress(a, p); }
    save(); render(); toast(isNew ? "課題を追加しました" : "保存しました");
  });
  if (!isNew) wireDelete("この課題を削除します。記録に加算済みの時間はそのまま残ります。", () => { S.asgs = A().filter(x => x.id !== a.id); });
  // 作業日のカレンダー:開始日〜提出期限の日だけ選べる
  const sel = new Set(a.days || []), pick = sheet.querySelector("#aPick"), sum = sheet.querySelector("#aPickSum");
  const sIn = sheet.querySelector("#aStart"), dIn = sheet.querySelector("#aDue"), pIn = sheet.querySelector("#aProg");
  const range = () => { const du = dIn.value || today(); let st = sIn.value || today(); if (st > du) st = du; return [st, du]; };
  function drawPick() {
    const [st, du] = range(), t = today(), ws = S.weekStart || 0;
    let m = new Date(parse(st).getFullYear(), parse(st).getMonth(), 1); const last = parse(du); let html = "", n = 0;
    while (m <= last && n < 6) {
      const y = m.getFullYear(), mo = m.getMonth(), days = new Date(y, mo + 1, 0).getDate(), lead = (m.getDay() - ws + 7) % 7;
      let cells = [...Array(7)].map((_, i) => `<span class="dw">${DOW[(i + ws) % 7]}</span>`).join("") + "<span></span>".repeat(lead);
      for (let d = 1; d <= days; d++) {
        const k = ymd(new Date(y, mo, d)), out = k < st || k > du;
        cells += `<button type="button" class="pd${sel.has(k) && !out ? " on" : ""}${k === du ? " due" : ""}${k === t ? " tdy" : ""}" data-pd="${k}"${out ? " disabled" : ""} aria-pressed="${sel.has(k) && !out}" aria-label="${mdw(k)}${k === du ? "(提出期限)" : ""}">${d}</button>`;
      }
      html += `<div class="pm"><b>${y}年${mo + 1}月</b><div class="pk7">${cells}</div></div>`;
      m = new Date(y, mo + 1, 1); n++;
    }
    pick.innerHTML = html; drawSum();
  }
  function drawSum() {
    const [st, du] = range(), ds = [...sel].filter(d => d >= st && d <= du), min = (+sheet.querySelector("#amH").value || 0) * 60 + (+sheet.querySelector("#amM").value || 0), p = +pIn.value || 0;
    const rest = ds.filter(d => d >= today()).length;
    sum.textContent = ds.length ? `${ds.length}日選択中${rest ? `・残りの見込み時間を割ると1日あたり約${hm(min * (100 - p) / 100 / rest)}` : ""}(赤い枠は提出期限)` : "まだ選んでいません。いつやるかを日付で選んでください(赤い枠は提出期限)。";
  }
  pick.addEventListener("click", e => { const b = e.target.closest("[data-pd]"); if (!b || b.disabled) return; const k = b.dataset.pd; sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle("on"); b.setAttribute("aria-pressed", sel.has(k)); drawSum(); });
  sheet.querySelectorAll("[data-pk]").forEach(b => b.addEventListener("click", () => {
    const [st, du] = range();
    if (b.dataset.pk === "clear") sel.clear();
    else for (let d = st; d <= du; d = addDays(d, 1)) { const w = parse(d).getDay(); if (b.dataset.pk === "all" || (w !== 0 && w !== 6)) sel.add(d); }
    drawPick();
  }));
  [sIn, dIn].forEach(x => x.addEventListener("change", drawPick));
  ["#amH", "#amM", "#aProg"].forEach(q => sheet.querySelector(q).addEventListener("input", drawSum));
  drawPick();
}
function daySheet(d) {
  const ts = sortT(S.tasks.filter(x => x.date === d)), ge = S.goals.filter(g => g.end === d), as = A().filter(a => a.due === d);
  openSheet(`<h2>${mdw(d)}</h2>
    ${ge.map(g => `<div class="day-h"><span><span class="dot" style="background:${gColor(g)}"></span>期限:${esc(g.title)}</span></div>`).join("")}
    ${as.map(asgRow).join("")}
    ${(() => { const pl = A().filter(a => (a.days || []).includes(d) && a.due !== d); return pl.length ? `<div class="sub-h">この日にやる課題</div>${pl.map(a => planRow({ a, min: asgPlan(d).find(x => x.a === a)?.min ?? 0 })).join("")}` : ""; })()}
    ${ts.length ? `<ul class="tasks">${ts.map(x => taskRow(x)).join("")}</ul>` : `<div class="empty">この日のタスクはありません。</div>`}
    <div class="acts"><button class="btn" data-close>閉じる</button><button class="btn" data-act="newAsg" data-due="${d}">+ この日が期限の課題</button><button class="btn pri" data-act="newTask" data-date="${d}">+ この日にタスク</button></div>`);
}
function manualRec() {
  openSheet(`<form><h2>手動で記録</h2>
    <label class="f">日付<input type="date" name="date" id="rDate" value="${today()}" max="${today()}" required></label>
    ${durFields("rm", 30, "時間", { sign: true })}
    <p class="empty" style="margin:0">「引く」を選ぶと、その日の記録から差し引きます。</p>
    <div class="acts"><button type="button" class="btn" data-close>キャンセル</button><button class="btn pri">記録する</button></div></form>`,
  fd => { const m = durRead(fd, "rm"); logAdd(fd.get("date"), "manual", m > 0 ? uid() : "-", "手動で記録", m); save(); render(); toast("記録しました"); });
}

/* ---------- 描画とイベント ---------- */
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
let calObs;
function render() {
  const page = document.getElementById("page");
  const old = document.getElementById("rm"); if (old && !rmReset) rmScroll = old.scrollLeft;
  page.innerHTML = { todo: pageTodo, road: pageRoad, work: pageWork, rec: pageRec, set: pageSet }[ui.tab]();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
  if (ui.tab === "rec") drawChart();
  const rm = document.getElementById("rm");
  if (rm) { if (rmReset || rmScroll == null) { rmScroll = 0; rmReset = false; } rm.scrollLeft = rmScroll; rm.addEventListener("scroll", () => { rmScroll = rm.scrollLeft; }); }
  if (calObs) calObs.disconnect();
  const more = document.getElementById("calMore");
  if (more && "IntersectionObserver" in window) {
    calObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && ui.calMonths < 60) { const y = scrollY; ui.calMonths += 6; render(); scrollTo(0, y); } }, { rootMargin: "400px" });
    calObs.observe(more);
  }
}
function go(tab) { keepVisible.clear(); ui.tab = tab; saveUI(); render(); scrollTo(0, 0); if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab); }
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (tabs.includes(h) && h !== ui.tab) go(h); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === "rec" || ui.tab === "road") render(); }, 150); });

// 並び順:≡ をつかんで上下に動かす。前後の項目の真ん中を越えると、その項目がずれて場所を空ける
function setSecOrder(o) { S.secOrder = o; save(); render(); toast(`並び順:${o.map(k => SEC[k]).join(" → ")}`); }
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("#secList .grip"); if (!h) return;
  e.preventDefault(); h.setPointerCapture?.(e.pointerId);
  const list = h.closest("ol"), items = [...list.children], me = h.closest("li"), si = items.indexOf(me);
  const rects = items.map(li => li.getBoundingClientRect()), H = rects[si].height + 6, y0 = e.clientY;
  list.classList.add("sorting"); me.classList.add("dragging");
  let target = si;
  const move = ev => {
    const dy = ev.clientY - y0, top = rects[si].top + dy, bottom = rects[si].bottom + dy;
    me.style.transform = `translateY(${dy}px)`; target = si;
    items.forEach((li, i) => {
      if (i === si) return;
      const mid = (rects[i].top + rects[i].bottom) / 2;
      const shift = i < si && top < mid ? H : i > si && bottom > mid ? -H : 0;
      li.style.transform = shift ? `translateY(${shift}px)` : "";
      if (shift > 0) target = Math.min(target, i); if (shift < 0) target = Math.max(target, i);
    });
  };
  const up = () => {
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
    items.forEach(li => { li.style.transform = ""; li.classList.remove("dragging"); }); list.classList.remove("sorting");
    if (target !== si) { const o = items.map(li => li.dataset.k); o.splice(target, 0, o.splice(si, 1)[0]); setSecOrder(o); }
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
});
document.addEventListener("keydown", e => {
  const h = e.target.closest?.("#secList .grip"); if (!h || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const o = secOrder(), i = o.indexOf(h.dataset.k), j = i + (e.key === "ArrowUp" ? -1 : 1);
  if (j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]]; setSecOrder(o);
  document.querySelector(`#secList .grip[data-k="${h.dataset.k}"]`)?.focus();
});
document.addEventListener("change", e => { if (e.target.id === "logDate" && e.target.value) { ui.logDate = e.target.value > today() ? today() : e.target.value; render(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const fromSheet = !!b.closest("#sheet");
  switch (a) {
    case "toggle": toggleTask(id); if (fromSheet) { const d = S.tasks.find(x => x.id === id)?.date; d && daySheet(d); } break;
    case "editTask": taskForm(S.tasks.find(x => x.id === id)); break;
    case "newTask": taskForm(null, { date: b.dataset.date, gid: b.dataset.gid }); break;
    case "toToday": { const t = S.tasks.find(x => x.id === id); t.date = today(); save(); render(); toast("今日のタスクに移動しました"); break; }
    case "rmView": keepVisible.clear(); ui.rmView = b.dataset.v; rmReset = true; ui.calMonths = 6; saveUI(); render(); break;
    case "span": ui.span = b.dataset.v; rmReset = true; saveUI(); render(); break;
    case "subj": ui.subj = b.dataset.v; rmReset = true; if (ui.subj) kids(null).forEach(r => kids(r.id).forEach(k => { if (k.title === ui.subj) setOpen(k.id, true); })); saveUI(); render(); break;
    case "showDone": ui.showDone = !ui.showDone; keepVisible.clear(); saveUI(); render(); toast(ui.showDone ? "完了したものを表示しています" : "完了したものを隠しました"); break;
    case "rmOpen": setOpen(id, !isOpen(id)); render(); break;
    case "offAdd": {
      const l = document.getElementById("offL").value.trim(), f = document.getElementById("offF").value, to = document.getElementById("offT").value || f;
      if (!f) { toast("始まりの日を入れてください"); break; }
      if (to < f) { toast("終わりの日は始まりの日より後にしてください"); break; }
      S.offRanges = [...(S.offRanges || []), { id: uid(), label: l || "休み", from: f, to }]; save(); render(); toast("休みの期間を追加しました"); break;
    }
    case "offDel": S.offRanges = (S.offRanges || []).filter(r => r.id !== id); save(); render(); break;
    case "openGoal": ui.rmView = "list"; ui.node = id; saveUI(); render(); scrollTo(0, 0); break;
    case "node": ui.node = id || null; saveUI(); render(); break;
    case "newGoal": goalForm(null, b.dataset.pid || null); break;
    case "editGoal": goalForm(G(id)); break;
    case "prog": { const g = G(id), p = Math.min(100, Math.max(0, (g.progress || 0) + +b.dataset.d)); const d = p - (g.progress || 0); setProgress(g, p); save(); render(); if (d) toast(`達成度 ${p}%:${hm(Math.abs((g.hours || 0) * 60 * d / 100))}を記録${d > 0 ? "に加算" : "から差し引き"}`); break; }
    case "day": daySheet(b.dataset.d); break;
    case "newAsg": asgForm(null, { due: b.dataset.due, gid: ui.tab === "road" && ui.rmView === "list" ? ui.node : "" }); break;
    case "editAsg": asgForm(AS(id)); break;
    case "asgDone": { const a = AS(id); if (!a.done) { a.prevProg = a.progress || 0; setAsgProgress(a, 100); toast("提出済みにしました"); } else { setAsgProgress(a, a.prevProg ?? 0); delete a.prevProg; toast("未提出に戻しました"); } save(); if (fromSheet) daySheet(a.due); render(); break; }
    case "goWork": go("work"); break;
    case "newMat": matForm(null, ui.node || ""); break;
    case "editMat": matForm(S.mats.find(x => x.id === id)); break;
    case "rep": { const m = S.mats.find(x => x.id === id); m.reps.push(today()); logAdd(today(), "mat", m.id, m.title, m.min); save(); render(); toast(`${m.reps.length}回目:${hm(m.min)}を記録に加算`); break; }
    case "repUndo": { const m = S.mats.find(x => x.id === id); const d = m.reps.pop(); logAdd(d, "mat", m.id, m.title, -m.min); save(); render(); toast("1回分を取り消しました"); break; }
    case "recUnit": ui.recUnit = b.dataset.v; saveUI(); render(); break;
    case "manualRec": manualRec(); break;
    case "logDay": { const d = addDays(ui.logDate || today(), +b.dataset.v); if (d <= today()) { ui.logDate = d; render(); } break; }
    case "editLog": { const e = L().find(x => x.id === id); if (e) logForm(e); break; }
    case "theme": ui.theme = b.dataset.v; saveUI(); applyTheme(); render(); toast({ auto: "自動にしました", light: "ライトモードにしました", dark: "ダークモードにしました" }[ui.theme]); break;
    case "reviewGo": (S.rv || (S.rv = { n: 0, next: 3 })).off = true; save(); if (fromSheet) closeSheet(); break;
    case "reviewLater": save(); closeSheet(); toast("また今度お願いします"); break;
    case "reviewOff": (S.rv || (S.rv = { n: 0, next: 3 })).off = true; save(); closeSheet(); toast("今後は表示しません"); break;
    case "secReset": delete S.secOrder; save(); render(); toast("初期設定(小さな目標 → タスク → 教材)に戻しました"); break;
    case "feedback": feedbackForm(); break;
    case "reviewNA": toast(`${b.dataset.v}にはまだ公開していません`); break;
    case "weekStart": S.weekStart = +b.dataset.v; save(); render(); break;
    case "clearSample": S = { v: 1, goals: [], tasks: [], mats: [], asgs: [], log: [], rec: {}, sample: false, weekStart: S.weekStart || 0, upd: 0 }; ui.node = null; save(); render(); toast("サンプルを消しました。「+ 目標」から始めましょう"); break;
    case "export": { const io = document.getElementById("io"); io.value = JSON.stringify(S); io.select(); navigator.clipboard?.writeText(io.value).then(() => toast("コピーしました"), () => toast("欄の文字を選択しました。コピーしてください")); break; }
    case "import": {
      try { const d = JSON.parse(document.getElementById("io").value); if (d.v !== 1 || !Array.isArray(d.goals)) throw 0; S = d; S.sample = false; save(); render(); toast("読み込みました"); }
      catch (err) { toast("読み込めませんでした。書き出したJSONをそのまま貼り付けてください"); }
      break;
    }
    case "askReset": {
      const v = b.dataset.v;
      document.getElementById("resetAsk").innerHTML = `<div class="confirm"><span>${v === "wipe" ? "すべてのデータを消去します。元に戻せません。" : "今のデータを見本データに置き換えます。"}</span><span class="acts"><button class="btn" data-act="resetNo">やめる</button><button class="btn danger" data-act="resetYes" data-v="${v}">実行する</button></span></div>`;
      break;
    }
    case "resetNo": document.getElementById("resetAsk").innerHTML = ""; break;
    case "resetYes": S = b.dataset.v === "wipe" ? { v: 1, goals: [], tasks: [], mats: [], asgs: [], log: [], rec: {}, sample: false, weekStart: S.weekStart || 0, upd: 0 } : sample(); ui.node = null; save(); render(); toast("完了しました"); break;
  }
});

// テーマ:ライト/ダークを選ぶと data-theme を固定。自動のときは開いたときの状態(claude.aiの設定か端末の設定)に戻す
const hostTheme = document.documentElement.getAttribute("data-theme");
function applyTheme() {
  const r = document.documentElement, v = ui.theme === "light" || ui.theme === "dark" ? ui.theme : hostTheme;
  if (v) r.setAttribute("data-theme", v); else r.removeAttribute("data-theme");
}
applyTheme();
render();
connect();
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
